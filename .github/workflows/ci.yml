name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=change_lens --cov-report=term-missing
      - run: docker build -t policy-change-lens:test .
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh
          zricethezav/gitleaks:v8.24.3 -c
          'git config --global --add safe.directory /repo &&
          gitleaks detect --source=/repo --redact --no-banner --log-opts=--all'
